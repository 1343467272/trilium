name: Mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile.yml"
      - ".github/actions/build-mobile/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      TRILIUM_SECURITY_BACKEND_SCRIPTING_ENABLED: "true"
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update build info
        run: pnpm run chore:update-build-info

      - name: Build client-standalone (webDir for Capacitor)
        run: pnpm --filter @triliumnext/mobile build

      - name: Sync Capacitor Android project
        run: pnpm --filter @triliumnext/mobile exec cap sync android

      - name: Build release APK (unsigned)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Sign release APK (v1/v2/v3/v4 signature schemes)
        if: env.ANDROID_KEYSTORE_B64 != ''
        run: |
          APKSIGNER="$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)"
          OUT_DIR="${RUNNER_TEMP}/signed"
          mkdir -p "$OUT_DIR"

          KEYSTORE="${RUNNER_TEMP}/release.keystore"
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KEYSTORE"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$OUT_DIR/TriliumNotes-release.apk" \
            apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk

          "$APKSIGNER" verify --print-certs "$OUT_DIR/TriliumNotes-release.apk"
          rm -f "$KEYSTORE"

      - name: Upload signed release APK
        if: env.ANDROID_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: trilium-mobile-android-release-signed
          path: |
            ${{ runner.temp }}/signed/TriliumNotes-release.apk
            ${{ runner.temp }}/signed/TriliumNotes-release.apk.idsig
          retention-days: 14

      - name: Upload unsigned APK (fallback when no signing secrets)
        if: env.ANDROID_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v7
        with:
          name: trilium-mobile-android-release-unsigned
          path: apps/mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14

  build_ios:
    name: Build iOS App
    # iOS builds require Xcode, which is only available on macOS runners.
    runs-on: macos-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update build info
        run: pnpm run chore:update-build-info

      - name: Build client-standalone (webDir for Capacitor)
        run: pnpm --filter @triliumnext/mobile build

      - name: Sync Capacitor iOS project
        run: pnpm --filter @triliumnext/mobile exec cap sync ios

      # Build an unsigned .app for the iOS Simulator. This sidesteps the need
      # for Apple Developer signing credentials and produces a bundle that can
      # be launched in the Simulator for smoke-testing or downloaded as an
      # artifact. Switch to a signed archive build once we have certs + a
      # provisioning profile in repo secrets.
      - name: Build iOS app for Simulator (unsigned)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .app bundle
        working-directory: apps/mobile/ios/App/build/Build/Products/Debug-iphonesimulator
        run: zip -ry App.app.zip App.app

      - name: Upload iOS Simulator app
        uses: actions/upload-artifact@v7
        with:
          name: trilium-mobile-ios-simulator-app
          path: apps/mobile/ios/App/build/Build/Products/Debug-iphonesimulator/App.app.zip
          retention-days: 14

      # Build an unsigned .ipa for real iOS devices (arm64). No Apple Developer
      # signing is involved, so a stock iOS device refuses to install it — it
      # requires a jailbroken device with AppSync Unified (or similar). The
      # deployment target (IPHONEOS_DEPLOYMENT_TARGET = 15.0) keeps the app
      # installable on iOS 16 and newer.
      - name: Build unsigned iOS app for device
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        working-directory: apps/mobile/ios/App/build-device/Build/Products/Release-iphoneos
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R App.app Payload/
          zip -ry TriliumNotes-unsigned-ios.ipa Payload

      - name: Upload unsigned iOS device .ipa
        uses: actions/upload-artifact@v7
        with:
          name: trilium-mobile-ios-device-unsigned-ipa
          path: apps/mobile/ios/App/build-device/Build/Products/Release-iphoneos/TriliumNotes-unsigned-ios.ipa
          retention-days: 14
